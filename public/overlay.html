<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYNSA · Alert-Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/overlay.css">
</head>
<body>
  <div id="alert-root">
    <div id="alert-card" class="alert-card" hidden>
      <svg class="ink-accent" viewBox="0 0 220 140" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="inkGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#72E3C5" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#35C9A8" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="M220,0 C188,6 166,26 176,54 C186,82 152,96 128,78 C110,64 118,32 146,14 C164,3 196,-4 220,0 Z" fill="url(#inkGrad)"/>
      </svg>
      <div class="accent-stripe"></div>
      <div class="icon-slot"></div>
      <div class="alert-content">
        <div class="alert-type"></div>
        <div class="alert-username"></div>
        <div class="alert-detail"></div>
      </div>
    </div>
  </div>
  <div class="preview-badge">Preview · transparent in OBS Browser Source</div>
  <button id="sound-unlock" class="sound-unlock" type="button" hidden>🔊 Sound aktivieren</button>
  <script src="/shared/alert-types.js"></script>
  <script src="/js/sounds.js"></script>
  <script src="/js/overlay.js"></script>
</body>
</html>
