<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYNSA · Diagnose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/control.css">
<link rel="stylesheet" href="/css/nav.css">
<link rel="stylesheet" href="/css/update.css">
<link rel="stylesheet" href="/css/diagnostics.css">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div class="header-left">
        <div id="module-menu-root"></div>
        <h1>Diagnose</h1>
      </div>
    </header>

    <!-- Only the Twitch banner, not the update banner: this page is meant to
         show state, and an "install now" button would be the one control on a
         page that deliberately has none. A broken Twitch link, on the other
         hand, is exactly what someone comes here to find out. -->
    <div id="auth-banner" hidden></div>

    <p class="hint">
      Diese Seite zeigt nur an und ändert nichts. Bei Problemen ist ein Screenshot davon die schnellste Art, den Zustand weiterzugeben.
    </p>

    <div class="diagnostics-grid" id="diagnostics-grid">
      <div class="card">
        <div class="card-title">Twitch</div>
        <div id="diag-twitch" class="diag-body"></div>
      </div>

      <div class="card">
        <div class="card-title">Overlays in OBS</div>
        <div id="diag-overlays" class="diag-body"></div>
      </div>

      <div class="card">
        <div class="card-title">Musik</div>
        <div id="diag-music" class="diag-body"></div>
      </div>

      <div class="card">
        <div class="card-title">Update</div>
        <div id="diag-update" class="diag-body"></div>
      </div>

      <div class="card">
        <div class="card-title">Server</div>
        <div id="diag-server" class="diag-body"></div>
      </div>
    </div>

    <p class="diag-footer" id="diag-footer"></p>
  </div>

  <script src="/i18n/en.js"></script>
  <script src="/shared/i18n.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="/shared/module-menu.js"></script>
  <script src="/shared/page-socket.js"></script>
  <script src="/shared/auth-banner.js"></script>
  <script src="/js/diagnostics.js"></script>
</body>
</html>
