<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYNSA · Über SYNSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

      </div>

    <!-- The same release history the welcome screen shows after an update,

      <div class="card-title">Änderungen</div>
      <div class="changelog-box about-changelog-box" id="changelog-box">
        <p class="changelog-empty">Wird geladen …</p>
      </div>
    </div>

  <script src="/i18n/en.js"></script>
